<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 웹게임엔진</title>
<style>
:root{--bg:#1e1f22;--panel:#26282c;--panel2:#2f3237;--line:#3a3d43;--ink:#e4e5e8;--muted:#9a9ea6;--accent:#4c8dff;--ok:#5fbf7a;--warn:#e0b04a;--bad:#ef6b6b;--sel:#2c4470}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template-rows:34px 1fr;height:100vh;overflow:hidden}
.bar{display:flex;align-items:center;gap:6px;padding:0 10px;background:#17181b;border-bottom:1px solid var(--line)}
.bar .brand{font-weight:700;margin-right:8px}
.bar .proj{margin-left:auto;color:var(--muted)} .dirty{color:var(--warn)}
button,select,input,textarea{font:inherit;color:var(--ink)}
.tb{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:3px 10px;cursor:pointer}
.tb:hover{border-color:var(--accent)} .tb.play{background:#264a32;border-color:#3d7a50} .tb.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.tb:disabled{opacity:.45}
.work{display:grid;grid-template-columns:260px minmax(0,1fr) 360px;grid-template-rows:minmax(0,1fr) 200px;grid-template-areas:"hier view insp" "dock dock dock";min-height:0}
.pane{background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.pane > .head{display:flex;align-items:center;gap:4px;height:30px;padding:0 6px;border-bottom:1px solid var(--line);background:#222428;flex:none}
.pane > .head .t{font-weight:600;color:var(--muted);padding:0 4px}
.pane > .body{flex:1;overflow:auto;padding:6px;min-height:0}
#hier{grid-area:hier} #view{grid-area:view} #insp{grid-area:insp;border-right:0} #dock{grid-area:dock;border-right:0}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:5px 10px;cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.row{display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:4px;cursor:pointer;white-space:nowrap}
.row:hover{background:var(--panel2)} .row.on{background:var(--sel)} .row.drop{outline:1px dashed var(--ok)}
.row .tw{width:12px;color:var(--muted);text-align:center;flex:none} .row .nm{overflow:hidden;text-overflow:ellipsis} .row .off{opacity:.45}
.row .cm{color:var(--muted);font-size:11px;margin-left:4px}
.add{margin-left:auto;background:none;border:1px solid transparent;color:var(--muted);border-radius:4px;cursor:pointer;padding:0 6px}
.add:hover{border-color:var(--line);color:var(--ink)}
.viewbody{flex:1;position:relative;min-height:0}
.viewbody > div{position:absolute;inset:0}
#sv{background:#0e0f11;overflow:hidden}
#sv .we-node.sel{outline:2px solid var(--accent);outline-offset:1px}
#sv .we-node:hover{outline:1px dashed rgba(76,141,255,.6)}
iframe{width:100%;height:100%;border:0;background:#000}
#code{width:100%;height:100%;background:#15161a;border:0;padding:10px 12px;font:13px/1.55 Consolas,"D2Coding",monospace;color:#dfe3ea;resize:none;tab-size:2;outline:none}
.codebar{position:absolute;left:0;right:0;bottom:0;padding:4px 10px;background:#1b1c20;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
label.f{display:block;margin:7px 0 2px;font-size:11.5px;color:var(--muted)}
.insp input,.insp select,.insp textarea{width:100%;background:#17181b;border:1px solid var(--line);border-radius:4px;padding:4px 6px}
.insp input[type=checkbox]{width:auto}
.comp{border:1px solid var(--line);border-radius:6px;margin:8px 0;background:#202226}
.comp > .ch{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--line);background:#2a2d32;font-weight:600}
.comp > .ch .kind{font-weight:400;color:var(--muted);font-size:11px}
.comp > .cb{padding:2px 8px 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fields{display:grid;grid-template-columns:1fr 1fr;column-gap:8px} .fields > .wide{grid-column:1 / -1}
.help{color:var(--muted);font-size:11.5px;margin:2px 0}
.msg{padding:3px 6px;border-bottom:1px solid #2c2f34;font-size:12.5px;white-space:pre-wrap}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)} .msg.warn{color:var(--warn)}
.file{display:flex;gap:6px;align-items:center;padding:2px 6px;border-radius:4px;cursor:pointer} .file:hover{background:var(--panel2)} .file.on{background:var(--sel)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100}
.modal[hidden]{display:none}
.modal .win{width:min(500px,92vw);max-height:80vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.modal .win input{width:100%;background:#17181b;border:1px solid var(--line);border-radius:4px;padding:6px}
#dv{overflow:auto;background:var(--panel)} .dhead{padding:8px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.dform{padding:6px 14px 20px;max-width:780px} details.dgroup{border:1px solid var(--line);border-radius:6px;padding:3px 10px 8px;margin:6px 0;background:#202226}
details.dgroup > summary{cursor:pointer;font-weight:600;padding:3px 0} .ditem{position:relative;border-left:2px solid var(--line);padding-left:8px;margin:4px 0}
.ditem > .add{position:absolute;right:0;top:2px;z-index:1}
.menu{position:relative} .menu .drop{display:none;position:absolute;top:100%;left:0;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px;min-width:170px}
.menu.open .drop{display:block} .drop button{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 9px;border-radius:4px;cursor:pointer} .drop button:hover{background:var(--sel)}
</style>
</head>
<body>
<div class="bar">
  <span class="brand">◆ AI 웹게임엔진</span>
  <button class="tb" data-cmd="newProject">＋ 새 프로젝트</button><button class="tb" data-cmd="openProject">📂 열기</button>
  <span style="width:8px"></span>
  <button class="tb" data-cmd="undo" title="되돌리기 (Ctrl+Z)">↶</button><button class="tb" data-cmd="redo" title="다시 하기 (Ctrl+Y)">↷</button>
  <button class="tb primary" data-cmd="save" id="saveBtn" title="바꾼 것을 저장 (Ctrl+S)">💾 저장</button>
  <button class="tb play" data-cmd="play" title="저장된 게임을 실행해 본다 (Ctrl+P)">▶ 게임 실행</button><button class="tb" data-cmd="stop" title="실행을 멈추고 화면 편집으로">⏹ 멈춤</button>
  <span class="proj" id="proj"></span>
</div>
<div class="work">
  <section class="pane" id="hier"><div class="head"><span class="t" title="지금 화면(씬)에 들어 있는 것들. 안에 넣으면 함께 움직인다">🧩 오브젝트</span><span id="sceneName" style="color:var(--muted)"></span>
      <span class="menu" style="margin-left:auto"><button class="add" id="addMenuBtn" title="고른 오브젝트 안에(없으면 맨 위에) 새로 만든다">＋ 만들기</button><div class="drop" id="addMenu"></div></span></div>
    <div class="body" id="hierBody"></div></section>
  <section class="pane" id="view"><div class="head tabs" id="viewTabs"><button data-view="scene" class="on" title="오브젝트를 보며 배치한다 (코드는 돌지 않음)">🎬 화면 편집</button><button data-view="game" title="게임을 실제로 돌려 본다">▶ 실행 화면</button><button data-view="code" title="게임 규칙을 코드로 쓴다">📜 코드</button><button data-view="data" title="데이터 파일(.json)의 값을 칸으로 고친다 — 코드를 몰라도 수치·문구 조정">📊 데이터</button></div>
    <div class="viewbody"><div id="sv"></div><div id="gv" hidden></div><div id="cv" hidden><textarea id="code" spellcheck="false"></textarea><div class="codebar" id="codebar"></div></div><div id="dv" hidden></div></div></section>
  <section class="pane" id="insp"><div class="head"><span class="t" title="고른 오브젝트의 이름과 기능들">🔧 속성</span></div><div class="body insp" id="inspBody"></div></section>
  <section class="pane" id="dock"><div class="head tabs" id="dockTabs"><button data-dock="project" class="on">📁 파일</button><button data-dock="console">🔔 알림·오류</button><button data-dock="history">🕘 저장 기록</button></div>
    <div class="body" id="dockBody"></div></section>
</div>
<div class="modal" id="modal" hidden><div class="win" id="modalWin"></div></div>
<script>
const TOKEN = "__TOKEN__";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
async function api(path, body) {
  const opt = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json", "X-Token": TOKEN}, body: JSON.stringify(body)};
  return (await fetch(path, opt)).json();
}
const loadScript = src => new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });

// ---------------- state ----------------
// Files are edited in memory (draft) and written on 💾; each write is checked by the server and logged.
let proj = null, saved = {}, draft = {}, scenePath = null, sel = null, codePath = null, dataPath = null, view = "scene", dock = "project", logs = [], svEngine = null;
const dirty = () => Object.keys(draft).filter(p => JSON.stringify(draft[p]) !== JSON.stringify(saved[p]));
const scene = () => scenePath ? draft[scenePath] : null;
function log(text, kind = "") { logs.unshift({text, kind, time: new Date().toTimeString().slice(0, 8)}); if (dock === "console") renderDock(); }

async function boot() {
  const eng = await api("/api/engine");
  await loadScript("/runtime/core.js");
  for (const m of eng.modules.filter(m => m !== "core")) await loadScript(`/runtime/${m}.js`);
  await openActive();
}
async function openActive() {
  const d = await api("/api/files");
  if (d.error || !d.project) { proj = null; renderAll(); return dialogNew(true); }
  proj = {id: d.project, meta: d.meta, files: d.files};
  saved = {}; draft = {}; sel = null; codePath = null;
  saved["project.json"] = d.meta;
  for (const f of d.files.filter(f => ["scene", "script", "prefab"].includes(f.kind) || isData(f.path) || isStyle(f.path))) {
    const c = (await api(`/api/file?path=${encodeURIComponent(f.path)}`)).content;
    if (isStyle(f.path)) saved[f.path] = b64ToText(c);
    else if (!isData(f.path)) saved[f.path] = c;
    else try { saved[f.path] = JSON.parse(b64ToText(c)); } catch (e) { log(`${f.path}: JSON으로 읽지 못함 — ${e.message}`, "bad"); }
  }
  if (dataPath && saved[dataPath] === undefined) dataPath = null;
  for (const p of Object.keys(saved)) if (p.startsWith("scenes/")) ensureIds(saved[p].nodes);   // ids for nodes made without one (not a change)
  draft = clone(saved);
  undo.list = [clone(draft)]; undo.at = 0;
  await reloadScripts();
  scenePath = `scenes/${proj.meta.start}.json` in draft ? `scenes/${proj.meta.start}.json` : Object.keys(draft).find(p => p.startsWith("scenes/"));
  renderAll();
}
// Project scripts register their components in this page too, so the inspector knows their props.
async function reloadScripts() {
  for (const p of Object.keys(saved).filter(p => p.startsWith("scripts/")))
    try { await loadScript(`/project/${p}?v=${Date.now()}`); } catch { log(`${p}: 불러오지 못함`, "bad"); }
}
function ensureIds(nodes) { for (const n of nodes || []) { if (!n.id) n.id = "n" + Math.random().toString(36).slice(2, 8); n.components = n.components || []; n.children = n.children || []; ensureIds(n.children); } }
function walk(nodes, fn, parent = null) { for (const n of nodes || []) { fn(n, parent); walk(n.children, fn, n); } }
function findNode(id) { let hit = null; walk(scene()?.nodes, (n, parent) => { if (n.id === id) hit = {n, parent}; }); return hit; }
const siblings = parent => parent ? parent.children : scene().nodes;
function renderAll() { renderBar(); renderHier(); renderInspector(); renderView(); renderDock(); }
function changed(full) { snap(); renderBar(); renderHier(); if (full) renderInspector(); if (view === "scene") renderScene(); }
// Undo / redo (Ctrl+Z / Ctrl+Y): a snapshot of all edited files after each change.
const undo = {list: [], at: 0};
function snap() {
  const now = JSON.stringify(draft);
  if (JSON.stringify(undo.list[undo.at]) === now) return;
  undo.list = undo.list.slice(0, undo.at + 1); undo.list.push(JSON.parse(now));
  if (undo.list.length > 100) undo.list.shift();
  undo.at = undo.list.length - 1;
}
function stepUndo(d) {
  const to = undo.at + d;
  if (to < 0 || to >= undo.list.length) return log(d < 0 ? "더 되돌릴 것이 없습니다" : "다시 할 것이 없습니다", "warn");
  undo.at = to; draft = clone(undo.list[to]);
  if (!scene()) scenePath = Object.keys(draft).find(p => p.startsWith("scenes/"));
  if (sel && sel !== "@project" && !findNode(sel)) sel = null;
  $("#code").dataset.path = ""; renderAll();
}
function renderBar() {
  const d = dirty();
  $("#proj").innerHTML = proj ? `<b>${esc(draft["project.json"]?.name || proj.id)}</b> <span>(${esc(proj.id)})</span> ${d.length ? `<span class="dirty">· 저장 안 함 ${d.length}</span>` : "· 저장됨"}` : "프로젝트 없음";
  $("#saveBtn").disabled = !d.length;
  $("#sceneName").textContent = scenePath ? "· " + scenePath.slice(7, -5) : "";
}

// ---------------- hierarchy ----------------
const PRESETS = {
  "빈 오브젝트": [{type: "Transform"}], "상자": [{type: "Transform", props: {w: 300, h: 200}}, {type: "Panel", props: {color: "#2a2f3a", radius: 8}}],
  "글자": [{type: "Transform", props: {w: 240, h: 40}}, {type: "Text", props: {text: "글자"}}], "버튼": [{type: "Transform", props: {w: 160, h: 44}}, {type: "Button"}],
  "그림": [{type: "Transform", props: {w: 160, h: 160}}, {type: "Image"}], "글 입력칸": [{type: "Transform", props: {w: 300, h: 40}}, {type: "TextInput"}]
};
const PRESET_ICON = {"빈 오브젝트": "◻", "상자": "▭", "글자": "🔤", "버튼": "🔘", "그림": "🖼", "글 입력칸": "⌨"};
// How a component is named on screen: icon + Korean title (the code name stays small and grey).
const compTitle = type => { const r = WebEngine.registry()[type]; return r ? `${r.cls.icon || (r.kind === "script" ? "📜" : "⚙")} ${r.cls.title || type}` : `⚠ ${type}`; };
const closed = new Set();
function renderHier() {
  const b = $("#hierBody");
  if (!scene()) { b.innerHTML = `<p class="help">씬이 없습니다. 아래 프로젝트 창에서 씬을 만드세요.</p>`; return; }
  const row = (n, depth) => `<div class="row ${sel === n.id ? "on" : ""}" draggable="true" data-id="${esc(n.id)}" style="padding-left:${6 + depth * 14}px">
      <span class="tw" data-tw="${esc(n.id)}">${n.children.length ? (closed.has(n.id) ? "▸" : "▾") : ""}</span><span class="nm ${n.active === false ? "off" : ""}">${esc(n.name)}</span>
      <span class="cm">${esc(n.components.filter(c => c.type !== "Transform").map(c => compTitle(c.type)).join(" · "))}</span></div>` +
    (closed.has(n.id) ? "" : n.children.map(c => row(c, depth + 1)).join(""));
  b.innerHTML = (scene().nodes.map(n => row(n, 0)).join("") || `<p class="help">이 화면은 비어 있습니다.<br>위의 <b>＋ 만들기</b>로 글자·버튼·상자 같은 오브젝트를 만드세요.<br>오브젝트를 다른 오브젝트 위로 끌어다 놓으면 그 안에 들어갑니다.</p>`) +
    `<div id="rootDrop" style="height:40px" title="여기로 끌어다 놓으면 맨 바깥으로"></div>`;
  b.querySelectorAll("[data-id]").forEach(el => el.onclick = ev => { if (ev.target.dataset.tw) return; select(el.dataset.id); });
  b.querySelectorAll("[data-tw]").forEach(el => el.onclick = () => { const id = el.dataset.tw; closed.has(id) ? closed.delete(id) : closed.add(id); renderHier(); });
  // Drag a row onto another to make it a child; onto the empty space below to put it at the top.
  let dragId = null;
  b.querySelectorAll("[data-id]").forEach(el => {
    el.ondragstart = () => { dragId = el.dataset.id; };
    el.ondragover = ev => { if (canMove(dragId, el.dataset.id)) { ev.preventDefault(); el.classList.add("drop"); } };
    el.ondragleave = () => el.classList.remove("drop");
    el.ondrop = ev => { ev.preventDefault(); moveNode(dragId, el.dataset.id); };
  });
  b.onclick = ev => { if (!ev.target.closest(".row") && sel && sel !== "@project") select(null); };   // empty space: nothing selected (new objects go to the top)
  const rd = $("#rootDrop");
  rd.ondragover = ev => ev.preventDefault(); rd.ondrop = ev => { ev.preventDefault(); moveNode(dragId, null); };
}
function canMove(id, toId) { if (!id || id === toId) return false; const src = findNode(id); let inside = false; walk(src.n.children, c => { if (c.id === toId) inside = true; }); return !inside; }
function moveNode(id, toId) {
  if (!canMove(id, toId)) return;
  const src = findNode(id), list = siblings(src.parent);
  list.splice(list.indexOf(src.n), 1);
  (toId ? findNode(toId).n.children : scene().nodes).push(src.n);
  changed(true);
}
function addNode(preset) {
  const parent = sel ? findNode(sel)?.n : null;
  const n = {id: "n" + Math.random().toString(36).slice(2, 8), name: preset === "빈 오브젝트" ? "오브젝트" : preset, components: clone(PRESETS[preset]), children: []};
  (parent ? parent.children : scene().nodes).push(n);
  if (parent) closed.delete(parent.id);
  sel = n.id; changed(true);
}
function select(id) { sel = id; renderHier(); renderInspector(); if (view === "scene") highlight(); }

// ---------------- inspector ----------------
const reg = () => WebEngine.registry();
function fieldInput(spec, value, path) {
  const P = esc(JSON.stringify(path)), t = spec.type;
  if (spec.options) return `<select data-p='${P}'>${spec.options.map(o => `<option value="${esc(o)}" ${o === value ? "selected" : ""}>${esc((spec.labels || {})[o] || o)}</option>`).join("")}</select>`;
  if (t === "bool") return `<input type="checkbox" data-t="bool" data-p='${P}' ${value ? "checked" : ""}>`;
  if (t === "number") return `<input type="number" step="any" data-t="num" data-p='${P}' value="${esc(value ?? "")}"${"min" in spec ? ` min="${spec.min}"` : ""}${"max" in spec ? ` max="${spec.max}"` : ""} placeholder="${esc(rangeText(spec.min, spec.max))}">`;
  if (t === "color") return `<div style="display:flex;gap:4px"><input type="color" data-p='${P}' value="${/^#[0-9a-f]{6}$/i.test(value || "") ? value : "#000000"}" style="width:40px;padding:0"><input data-p='${P}' value="${esc(value ?? "")}" placeholder="비우면 없음"></div>`;
  if (t === "asset") return `<select data-p='${P}'><option value="">(없음)</option>${(proj.files || []).filter(f => f.kind === "asset").map(f => f.path.slice(7)).map(a => `<option ${a === value ? "selected" : ""}>${esc(a)}</option>`).join("")}</select>`;
  if (t === "node") { const paths = []; walk(scene().nodes, (n, parent) => paths.push(nodePath(n))); return `<select data-p='${P}'><option value="">(없음)</option>${paths.map(p => `<option ${p === value ? "selected" : ""}>${esc(p)}</option>`).join("")}</select>`; }
  if (t === "list" || t === "json") return `<textarea rows="2" data-t="json" data-p='${P}' style="font-family:Consolas,monospace">${esc(JSON.stringify(value ?? (t === "list" ? [] : null)))}</textarea>`;
  return String(value ?? "").length > 40 ? `<textarea rows="3" data-p='${P}'>${esc(value ?? "")}</textarea>` : `<input data-p='${P}' value="${esc(value ?? "")}">`;
}
// Units and allowed ranges come from the prop spec (unit, min, max) or a data schema (unit, minimum, maximum).
const rangeText = (min, max) => min !== undefined && max !== undefined ? `${min} ~ ${max}` : min !== undefined ? `${min} 이상` : max !== undefined ? `${max} 이하` : "";
const outOfRange = (v, min, max) => (min !== undefined && v < min) || (max !== undefined && v > max);
const fieldLabel = (label, unit, min, max) => `${esc(label)}${unit ? ` <span class="help">(${esc(unit)})</span>` : ""}${rangeText(min, max) ? ` <span class="help">· ${esc(rangeText(min, max))}</span>` : ""}`;
function nodePath(n) { const chain = []; let cur = findNode(n.id); while (cur) { chain.unshift(cur.n.name); cur = cur.parent ? findNode(cur.parent.id) : null; } return chain.join("/"); }
function renderInspector() {
  const b = $("#inspBody");
  if (!proj) { b.innerHTML = ""; return; }
  if (sel === "@project") {
    const m = draft["project.json"], s = m.settings || {};
    const scenes = Object.keys(draft).filter(p => p.startsWith("scenes/")).map(p => p.slice(7, -5));

function dataField(v, s, path, key) {

  const P = esc(JSON.stringify(path)), label = s.title || key, code = s.title && key ? ` <span class="help" style="font-size:10.5px">${esc(key)}</span>` : "";
  const help = s.description ? `<div class="help">${esc(s.description)}</div>` : "";
  if (s.format === "condition")
    return `<div class="dcond"><label class="f">${fieldLabel(label)}${code} <span class="help">· 조건</span></label><div class="help" data-cond-text>${esc(condText(v))}</div>`
      + `<textarea rows="2" data-dp='${P}' data-dt="cond" style="font-family:Consolas,monospace">${esc(v === undefined ? "" : JSON.stringify(v))}</textarea>`
      + `<div class="help">all(모두)·any(하나라도)·not(아님)·has(있음)·is(같음)·cmp(비교) — 예: {"all": [{"has": "fact.x"}, {"cmp": ["count", "<=", 3]}]}</div>`
      + `<div class="help" data-cond-vars>${declaredVars() ? "쓸 수 있는 이름: " + esc(varsText(declaredVars()).split("\n").join(" · ")) : "쓸 수 있는 이름: 선언 없음 (⚙ 게임 설정에서 적으면 이름도 검사)"}</div>${help}</div>`;
  if (Array.isArray(v)) {
    const items = v.map((x, i) => `<div class="ditem"><button class="add" data-ddel='${esc(JSON.stringify([...path, i]))}' title="이것 지우기">✕</button>${dataField(x, s.items, [...path, i], `${i + 1}번째`)}</div>`).join("");
    return `<details open class="dgroup"><summary>${fieldLabel(label)}${code} <span class="help">목록 ${v.length}개</span></summary>${help}${items}<button class="tb" data-dadd='${P}' style="margin-top:4px">＋ 추가</button></details>`;
  }
  if (v && typeof v === "object") {
    const inner = Object.keys(v).map(k => dataField(v[k], subSchema(s, k), [...path, k], k)).join("");
    return path.length ? `<details ${path.length < 3 ? "open" : ""} class="dgroup"><summary>${fieldLabel(label)}${code}${summaryOf(v)}</summary>${help}${inner}</details>` : help + inner;
  }
  const t = s.type || (typeof v === "number" ? "number" : typeof v === "boolean" ? "boolean" : "string");
  let input;
  if (s.enum) input = `<select data-dp='${P}' data-dt="${typeof s.enum[0] === "number" ? "num" : "str"}">${s.enum.map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  else if (t === "boolean") input = `<input type="checkbox" data-dp='${P}' data-dt="bool" ${v ? "checked" : ""}>`;
  else if (t === "number" || t === "integer") input = `<input type="number" data-dp='${P}' data-dt="num" step="${t === "integer" ? 1 : "any"}" value="${esc(v ?? "")}"${s.minimum !== undefined ? ` min="${s.minimum}"` : ""}${s.maximum !== undefined ? ` max="${s.maximum}"` : ""}>`;
  else input = String(v ?? "").length > 40 || String(v ?? "").includes("\n") ? `<textarea rows="${Math.min(6, 1 + Math.ceil(String(v).length / 70))}" data-dp='${P}' data-dt="str">${esc(v ?? "")}</textarea>` : `<input data-dp='${P}' data-dt="str" value="${esc(v ?? "")}">`;
  return `<div><label class="f">${fieldLabel(label, s.unit, s.minimum, s.maximum)}${code}</label>${input}${help}</div>`;
}
function renderData() {
  const box = $("#dv");
  if (!dataPath || draft[dataPath] === undefined) { box.innerHTML = `<p class="help" style="padding:12px">아래 📁 파일의 <b>🖼 자원</b>에서 📊 데이터 파일(.json)을 누르면, 그 값들을 여기서 칸으로 고칠 수 있습니다 (코드를 몰라도 수치·문구 조정).</p>`; return; }
  const s = schemaOf(dataPath), name = dataPath.slice(7);
  box.innerHTML = `<div class="dhead"><b>📊 ${esc(name)}</b> <span class="help">${s ? `설명 파일 ${esc(name.slice(0, -5))}.schema.json 을 따릅니다 — 칸 이름·단위·범위가 거기서 옵니다. 범위를 벗어난 값은 받지 않습니다.` : name.endsWith(".schema.json") ? "설명 파일 — 데이터 칸의 이름·단위·범위를 정합니다" : "설명 파일(.schema.json)이 없어 칸 이름이 코드 이름 그대로입니다"}</span></div><div class="dform insp">${dataField(draft[dataPath], s, [], "")}</div>`;
  box.querySelectorAll("[data-dp]").forEach(el => el.onchange = () => {
    const path = JSON.parse(el.dataset.dp), sub = schemaAt(s, path) || {}, dt = el.dataset.dt;
    let v = dt === "num" ? Number(el.value) : dt === "bool" ? el.checked : el.value;
    if (dt === "cond") {                    // a condition: JSON in the engine's condition form, or empty for none
      let c, bad;
      try { c = el.value.trim() ? JSON.parse(el.value) : null; bad = COND().problems(c, sub.title || path.at(-1), declaredVars()); } catch (e) { bad = [`조건을 읽을 수 없음: ${e.message}`]; }
      if (bad.length) { el.style.borderColor = "var(--bad)"; return log(`${bad[0]} — 바꾸지 않았습니다`, "warn"); }
      v = c; const t = el.parentElement && el.parentElement.querySelector("[data-cond-text]"); if (t) t.textContent = condText(c);
    }
    if (dt === "num" && (el.value === "" || Number.isNaN(v) || outOfRange(v, sub.minimum, sub.maximum) || (sub.type === "integer" && !Number.isInteger(v)))) {
      el.style.borderColor = "var(--bad)";
      return log(`'${sub.title || path.at(-1)}'은(는) ${sub.type === "integer" ? "정수" : "숫자"}${rangeText(sub.minimum, sub.maximum) ? ", " + rangeText(sub.minimum, sub.maximum) : ""}여야 합니다 — 바꾸지 않았습니다`, "warn");
    }
    el.style.borderColor = ""; getAt(draft[dataPath], path.slice(0, -1))[path.at(-1)] = v; changed(false);
  });
  box.querySelectorAll("[data-dadd]").forEach(b => b.onclick = () => { const path = JSON.parse(b.dataset.dadd), arr = getAt(draft[dataPath], path); arr.push(arr.length ? clone(arr.at(-1)) : blank(schemaAt(s, path)?.items)); changed(false); renderData(); });
  box.querySelectorAll("[data-ddel]").forEach(b => b.onclick = () => { const path = JSON.parse(b.dataset.ddel); getAt(draft[dataPath], path.slice(0, -1)).splice(path.at(-1), 1); changed(false); renderData(); });
}

const TEMPLATE = name => `// ${name}: 오브젝트에 붙여서 그 오브젝트가 할 일을 정하는 코드.
WebEngine.script("${name}", class extends WebEngine.Component {
  static title = "${name}";              // 속성 창에 보일 이름
  static help = "";                      // 한 줄 설명

  // 속성 창에 나올 칸. 코드이름: {type, default, label: "보일 이름", help: "설명", unit: "초", min: 0, max: 10}
  //   type: "number" 숫자 · "text" 글 · "bool" 예/아니오 · "color" 색 · "node" 다른 오브젝트 · "asset" 파일 · "list" 목록
  //   사람이 조정할 값(속도·횟수·확률·문구)은 코드에 박지 말고 여기나 데이터 파일(.json + .schema.json)에 둔다.
  static props = {};

  start() {
    // 시작할 때 한 번. 예) this.node.on("click", () => { … }, this);
  }

  update(dt) {
    // 매 프레임. dt = 지난 프레임부터 흐른 초
  }
});
`;
function newScript(attachTo) {
  const name = prompt("새 코드의 이름 (한글·영어·숫자, 띄어쓰기 없이. 예: 점수판)", "");
  if (!name) return;
  if (!/^[A-Za-z가-힣_][\w가-힣]*$/.test(name)) return alert("띄어쓰기·기호 없이 한글·영어·숫자로 써 주세요 (숫자로 시작할 수 없음).");
  const path = `scripts/${name}.js`;
  if (draft[path] !== undefined) return alert("이미 있는 이름입니다.");
  draft[path] = TEMPLATE(name);
  try { new Function("WebEngine", draft[path])(WebEngine); } catch (e) { log(e.message, "bad"); }   // known to the inspector right away
  if (attachTo) attachTo.components.push({type: name, props: {}});
  openCode(path); changed(true);
}
function newScene() {
  const name = prompt("새 화면(씬)의 이름 (예: 시작화면)", ""); if (!name) return;
  if (!/^[\w가-힣-]+$/.test(name)) return alert("띄어쓰기·기호 없이 한글·영어·숫자로 써 주세요.");
  const path = `scenes/${name}.json`; if (draft[path]) return alert("이미 있는 씬입니다.");
  draft[path] = {name, nodes: []}; scenePath = path; sel = null; renderAll();
}
async function upload(file) {
  const data = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.readAsDataURL(file); });
  const r = await api("/api/file", {path: `assets/${file.name}`, content: data, note: "자원 올림"});
  log(r.ok ? `자원 올림: assets/${file.name}` : r.errors.join("\n"), r.ok ? "ok" : "bad");
  if (r.ok && isData(`assets/${file.name}`)) try { const p = `assets/${file.name}`; saved[p] = JSON.parse(b64ToText(data)); draft[p] = clone(saved[p]); } catch { /* not JSON: stays a plain file */ }
  if (r.ok) { proj.files = (await api("/api/files")).files; renderDock(); }
}

// ---------------- save (scripts first: scenes may use their components) ----------------
async function save() {
  // scripts and data schemas first: scenes use script components, data files are checked against their schema
  const rank = p => p.startsWith("scripts/") || p.endsWith(".schema.json") ? 0 : p === "project.json" ? 2 : 1;
  const files = dirty().sort((a, b) => rank(a) - rank(b));
  if (!files.length) return;
  for (const p of files) if (p.startsWith("scripts/")) { try { new Function("WebEngine", draft[p]); } catch (e) { setDock("console"); return log(`저장 안 함 — ${p} 문법 오류: ${e.message}`, "bad"); } }
  let bad = 0;
  for (const p of files) {
    const r = await api("/api/file", {path: p, content: isData(p) ? textToB64(JSON.stringify(draft[p], null, 1)) : isStyle(p) ? textToB64(draft[p]) : draft[p], note: "편집기 저장"});
    if (r.ok) saved[p] = clone(draft[p]); else { bad++; r.errors.forEach(e => log("✖ " + e, "bad")); }
  }
  log(bad ? `저장 실패 ${bad}개 (콘솔의 위치를 보세요)` : `저장함: ${files.join(", ")}`, bad ? "bad" : "ok");
  if (files.some(p => p.startsWith("scripts/"))) await reloadScripts();
  proj.files = (await api("/api/files")).files;
  if (bad) setDock("console");
  renderAll();
}

// ---------------- projects ----------------
function modal(html, bind) { $("#modalWin").innerHTML = html; $("#modal").hidden = false; bind($("#modalWin")); }
const closeModal = () => { $("#modal").hidden = true; };
function dialogNew(first) {
  modal(`<h3 style="margin-top:0">새 프로젝트</h3><p class="help">${first ? "아직 프로젝트가 없습니다. " : ""}빈 씬 하나로 시작합니다.</p><input id="npName" placeholder="게임 이름">
    <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:12px">${first ? "" : `<button class="tb" id="npNo">취소</button>`}<button class="tb primary" id="npOk">만들기</button></div>`, w => {
    w.querySelector("#npName").focus();
    if (!first) w.querySelector("#npNo").onclick = closeModal;
    w.querySelector("#npOk").onclick = async () => { const name = w.querySelector("#npName").value.trim(); if (!name) return; await api("/api/projects/new", {name}); closeModal(); await openActive(); };
  });
}
async function dialogOpen() {
  const d = await api("/api/projects");
  modal(`<h3 style="margin-top:0">프로젝트 열기</h3>${d.projects.map(p => `<div class="file" style="justify-content:space-between"><span><b>${esc(p.name)}</b> <span class="help">${esc(p.id)}</span></span>
      <span>${p.id === d.active ? `<span class="help">열려 있음</span>` : `<button class="tb primary" data-open="${esc(p.id)}">열기</button>`} <button class="tb" data-del="${esc(p.id)}">삭제</button></span></div>`).join("")}
    <div style="text-align:right;margin-top:10px"><button class="tb" id="opClose">닫기</button></div>`, w => {
    w.querySelector("#opClose").onclick = closeModal;
    w.querySelectorAll("[data-open]").forEach(b => b.onclick = async () => { await api("/api/projects/open", {id: b.dataset.open}); closeModal(); await openActive(); });
    w.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { if (!confirm("휴지통으로 옮길까요?")) return; await api("/api/projects/delete", {id: b.dataset.del}); await openActive(); dialogOpen(); });
  });
}

// ---------------- commands ----------------
async function run(cmd) {
  if (cmd === "newProject" || cmd === "openProject") { if (dirty().length && !confirm("저장하지 않은 변경이 사라집니다. 계속할까요?")) return; return cmd === "newProject" ? dialogNew(false) : dialogOpen(); }
  if (cmd === "save") return save();
  if (cmd === "undo") return stepUndo(-1);
  if (cmd === "redo") return stepUndo(1);
  if (cmd === "play") return play();
  if (cmd === "stop") { $("#gv").innerHTML = ""; return setView("scene"); }
}
document.querySelectorAll("[data-cmd]").forEach(b => b.onclick = () => run(b.dataset.cmd));
document.querySelectorAll("#viewTabs button").forEach(b => b.onclick = () => setView(b.dataset.view));
document.querySelectorAll("#dockTabs button").forEach(b => b.onclick = () => setDock(b.dataset.dock));
$("#addMenu").innerHTML = Object.keys(PRESETS).map(k => `<button data-preset="${esc(k)}">${PRESET_ICON[k] || ""} ${esc(k)}</button>`).join("");
$("#addMenuBtn").onclick = e => { e.stopPropagation(); $("#addMenuBtn").parentElement.classList.toggle("open"); };
$("#addMenu").querySelectorAll("[data-preset]").forEach(b => b.onclick = () => { $("#addMenuBtn").parentElement.classList.remove("open"); if (scene()) addNode(b.dataset.preset); });
document.addEventListener("click", () => $("#addMenuBtn").parentElement.classList.remove("open"));
document.addEventListener("keydown", e => {
  const mod = e.ctrlKey || e.metaKey, inField = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (mod && e.key === "s") { e.preventDefault(); save(); }
  if (mod && e.key === "p") { e.preventDefault(); play(); }
  if (mod && !inField && e.key.toLowerCase() === "z") { e.preventDefault(); stepUndo(e.shiftKey ? 1 : -1); }   // fields keep their own undo
  if (mod && !inField && e.key.toLowerCase() === "y") { e.preventDefault(); stepUndo(1); }
});
window.addEventListener("beforeunload", e => { if (dirty().length) { e.preventDefault(); e.returnValue = ""; } });
window.addEventListener("resize", () => { if (view === "scene") renderScene(); });
// #select=<object name> opens the editor with that object selected (links, screenshots).
const pickFromHash = () => { const m = decodeURIComponent(location.hash).match(/^#select=(.+)$/); if (!m || !scene()) return; walk(scene().nodes, n => { if (n.name === m[1]) select(n.id); }); };
if (new URLSearchParams(location.search).has("uitest")) boot().then(() => loadScript("/editor/uitest.js")); else boot().then(pickFromHash);
</script>
